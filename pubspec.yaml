name: consome_plus
description: Consome+ — app para incentivar compras conscientes (Flutter)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  shared_preferences: ^2.1.1
  uuid: ^3.0.7
  flutter_svg: ^1.1.6
  google_fonts: ^4.0.4
  intl: ^0.18.1
  flutter_localizations:
    sdk: flutter
  animations: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  mockito: ^5.4.0
  test: ^1.22.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
